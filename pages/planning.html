        <title>Taniti Vacations</title>

        <link href="../css/reset.css" rel="stylesheet" />
        <link href="../css/style.css" rel="stylesheet" />
        <script src="../js/authorizePayment.js" defer></script>
    </head>


<main class="container">
    <header class="pageHeader">
        <div class="headerContainer | bg-primaryaccent-400 | padding-block-600 | padding-inline-600">
            <a href=../index.html><img id="companyLogo" src="../images/companyLogo.png" alt="Company name with a beach and island in the
            background."/></a>
            <div class="headerNavigationAndCTA">
                <nav class="primaryNavigation">
                    <ul role="list" class="navList">
                        <li><a href="../index.html" class="padding-inline-600">Home</a></li>
                        <li><a href="../pages/about.html" class="padding-inline-600">About</a></li>
                        <li><a href="../pages/about.html#faq" class="padding-inline-600">FAQs</a></li>
                        <li><a href="../pages/transportation.html" class="padding-inline-600">Transportation</a></li>
                        <li><a href="../pages/experiences.html" class="padding-inline-600">Experiences</a></li>
                        <li><a href="../pages/lodging.html" class="padding-inline-600">Lodging</a></li>
                        <li><a href="../pages/foodAndDining.html" class="padding-inline-600">Food & Dining</a></li>
                        <li><a href="../pages/planning.html" class="padding-inline-600 | active">Planning</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    </div>
    <article class="content | bg-primaryaccent-400 ">
        <form action="" method="post" enctype="text/plain" id="paymentForm" class="formColumns | padding-inline-600">
            <div class="leftColumn">
                <label for="name">*Name:</label>
                <label for="email">*Email:</label>
                <label for="confirmEmail">*Confirm Email:</label>
                <label for="number">Number:</label>
                <label for="toIslandTransportation">*Transportation to island:</label>
                <label for="onIslandTransportation">*Transportation on island:</label>
                <label for="lodging">*Lodging:</label>
                <label for="numberOfGuests">*Number of Guests:</label>
                <label for="lengthOfStay">*Length of Stay:</label>
                <label for="totalCost">Total Cost:</label>
                <label for="cardName">*Name on Card:</label>
                <label for="cardNumber">*Card Number:</label>
                <label for="cvv">*CVV:</label>
                <label for="cardExpirationDate">*Expiration Date:</label>
            </div>
            <div class="rightColumn">
                <input name="username" class="needsChecked" placeholder="John Doe" id="username" type="text" required/>
                <input name="email" class="needsChecked" placeholder="Enter email address" id="email" type="email" required/>
                <input name="confirmEmail" class="needsChecked" placeholder="Enter email address" id="confirmEmail" type="email" required/>
                <input name="number" placeholder="Enter phone number" id="number" type="tel"/>
                <select name="toIslandTransportation" id="toIslandSelect" required>
                    <option value="airplane" data-price="200">Airplane</option>
                    <option value="crusieShip" data-price="0">Cruise Ship</option>
                </select>
                <select name="onIslandTransportation" id="onIslandSelect" required>
                    <option value="none" data-price="0">None</option>
                    <option value="bike" data-price="0">Bike</option>
                    <option value="publicTransport" data-price="0">Public Transportation</option>
                    <option value="rentalCar" data-price="50">Car Rental</option>
                    <option value="shareCar" data-price="0">Car Share</option>
                    <option value="hotelShuttle" data-price="0">Hotel Shuttle</option>
                </select>
                <select name="lodging" id="lodgingSelect" required>
                    <option value="hostel" data-price="10">Hostel</option>
                    <option value="hotel" data-price="50">Hotel</option>
                    <option value="bedAndBreakfast" data-price="50">Bed & Breakfast</option>
                    <option value="resort" data-price="250">Resort</option>
                </select>
                <input name="numberOfGuests" class="needsChecked" placeholder="Enter number of guests" id="numberOfGuests" type="number" required/>
                <input name="lengthOfStay" class="needsChecked" placeholder="Enter number of nights" id="lengthOfStay" type="text" required/>
                <label for="totalCost" name="totalCost" id="totalCost" type="currency">$0.00</label>
                <input name="cardName" class="needsChecked" placeholder="Enter name on card" id="cardName" type="text" required/>
                <input name="cardNumber" class="needsChecked" placeholder="Enter card number" id="cardNumber" type="number" required/>
                <input name="cvv" class="needsChecked" placeholder="Enter CVV" id="cvv" type="password" required/>
                <input name="cardExpirationDate" class="needsChecked" placeholder="01/2001" id="cardExpirationDate" type="month" required/>
            </div>
        </form>
    </article>
    <div class="bookNowButtonDiv | bg-primaryaccent-400 | padding-block-600">
        <!-- Form buttons here -->
        <p class="padding-block-600" id="formMessage"></p>
        <input class="submitFormButton" type="submit" id="submit" onclick="submitPaymentForm(event)" value="Authorize Payment" />
        <input class="clearFormButton" type="button" onclick="clearForm()" id="clear" value="Clear" />
    </div>
    <footer class="footer | bg-primary-400">
        <div>
            <!-- Company Name TextBox here -->
            <p class="footerInfo">
                Taniti Vacations
            </p>
        </div>
        <nav class="secondaryNavigation">
            <ul role="list" class="navList">

                <li><a href="../pages/about.html#faq" class="padding-inline-600">FAQs</a></li>
                <li><a href="../pages/transportation.html" class="padding-inline-600">Transportation</a></li>
                <li><a href="../pages/experiences.html" class="padding-inline-600">Experiences</a></li>
                <li><a href="../pages/lodging.html" class="padding-inline-600">Lodging</a></li>
                <li><a href="../pages/foodAndDining.html" class="padding-inline-600">Food & Dining</a></li>
                <li><a href="../pages/planning.html" class="padding-inline-600">Planning</a></li>
            </ul>
        </nav>
        <div>
            <!-- Copyright here -->
             <p class="footerInfo">
                Copyright &#169; Taniti Vacations 2026
             </p>
        </div>
    </footer>
</main>
</html>
